name: 勘误 / Errata
description: 事实错误、表述问题、失效链接
title: "[errata] "
labels: ["errata"]
body:
  - type: markdown
    attributes:
      value: |
        发现错误请填这里。「我觉得这样写不好」不是勘误——请说清读者会因此误解什么。
  - type: input
    id: section
    attributes:
      label: 章节
      description: 如 9.4、14.2
      placeholder: "9.4"
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: 原文摘录
      description: 复制出错的那一段（不必整节）
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议改为
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: 依据
      description: 官方文档链接、标准条文、或可复现的现场经验
    validations:
      required: true
